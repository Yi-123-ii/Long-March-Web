<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">从中央红军抵达陕北，到红军三大主力会师</title><desc id="desc">1935年10月19日中央红军抵达吴起镇，1936年10月9日红一、红四方面军会宁会师，10月22日红二方面军在将台堡与红一方面军会师。时间关系示意，非地理路线图。</desc>
<rect width="1100" height="650" fill="#e8ede5"/><path d="m0 465 110-50 105 30 130-70 130 80 112-42 155 36 115-65 143 60v206H0Z" fill="#d4dfd0"/><path d="m0 540 170-60 160 40 180-65 200 95 155-47 235 57v90H0Z" fill="#c2d0c1"/>
<g fill="#294238" font-family="SimSun,Songti SC,serif"><text x="70" y="90" font-size="37" letter-spacing="4">抵达之后，仍有同行的人</text><text x="72" y="128" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#6a7b6d">1935 — 1936 · 长征结束的两个时间层次</text></g>
<path d="M110 300h880" fill="none" stroke="#a9b9a4" stroke-width="3"/><path d="M130 300h430" stroke="#963e39" stroke-width="3" stroke-dasharray="7 9"/><g fill="#963e39"><circle cx="130" cy="300" r="9"/><circle cx="570" cy="300" r="9"/><circle cx="895" cy="300" r="9"/></g>
<g fill="#294238" font-family="SimSun,Songti SC,serif"><text x="90" y="224" font-size="45">1935</text><text x="530" y="224" font-size="45">1936</text><text x="90" y="263" font-size="22">10月19日</text><text x="530" y="263" font-size="22">10月9日</text><text x="855" y="263" font-size="22">10月22日</text><text x="90" y="355" font-size="28">吴起镇</text><text x="530" y="355" font-size="28">会宁</text><text x="855" y="355" font-size="28">将台堡</text></g>
<g fill="#5b705f" font-family="Microsoft YaHei,sans-serif" font-size="18"><text x="90" y="395">中央红军抵达陕北</text><text x="530" y="395">红一、红四方面军会师</text><text x="855" y="395">红二与红一</text><text x="855" y="425">方面军会师</text></g>
<g fill="#47634c" font-family="SimSun,Songti SC,serif"><text x="72" y="560" font-size="25">一支队伍的落脚，与三大主力的会合。</text><text x="74" y="602" font-size="16">史实时序示意 · 非地理路线图</text></g></svg>
