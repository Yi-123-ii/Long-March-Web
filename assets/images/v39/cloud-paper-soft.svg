  </defs>
  <g filter="url(#drift)">
    <ellipse fill="url(#mist)" cx="130" cy="150" rx="390" ry="135"/>
    <ellipse fill="url(#mist)" cx="790" cy="180" rx="370" ry="120"/>
    <ellipse fill="url(#mist)" cx="1400" cy="105" rx="310" ry="135"/>
  </g>
  <path fill="url(#paper)" d="M0 0H1440V320H0Z"/>
</svg>
